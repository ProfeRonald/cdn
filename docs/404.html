<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>P&aacute;gina no encontrada | escuelaRD</title>
    <style>
      :root { color-scheme: light dark; --ink:#172033; --muted:#667085; --surface:#fff; --line:#dce3ed; --primary:#1264d8; --primary-dark:#0d4eae; --accent:#10bda5; --background:#f3f7fb; }
      * { box-sizing: border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--background); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
      .page { width:min(100%,520px); overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--surface); box-shadow:0 18px 45px rgba(25,54,95,.12); }
      .topline { height:6px; background:linear-gradient(90deg,var(--primary),var(--accent)); }
      .content { padding:42px 38px 36px; text-align:center; }
      .logo { display:block; width:74px; height:74px; margin:0 auto 22px; object-fit:contain; }
      .code { display:inline-flex; align-items:center; min-height:34px; padding:5px 12px; border:1px solid #b9d2f7; border-radius:999px; background:#edf5ff; color:var(--primary-dark); font-size:.84rem; font-weight:800; letter-spacing:.04em; }
      h1 { margin:16px 0 10px; font-size:clamp(1.65rem,5vw,2.15rem); line-height:1.12; }
      p { max-width:390px; margin:0 auto 28px; color:var(--muted); font-size:1rem; line-height:1.55; }
      .button { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 20px; border-radius:7px; background:var(--primary); color:#fff; font-size:.95rem; font-weight:750; text-decoration:none; transition:background 160ms ease,transform 160ms ease; }
      .button:hover { background:var(--primary-dark); transform:translateY(-1px); }
      .button:focus-visible { outline:3px solid rgba(18,100,216,.3); outline-offset:3px; }
      .footer { padding:13px 20px; border-top:1px solid var(--line); color:var(--muted); font-size:.78rem; text-align:center; }
      @media (prefers-color-scheme:dark) { :root { --ink:#edf4ff; --muted:#a9b5c8; --surface:#172033; --line:#2d3a50; --background:#0f1728; } .code { border-color:#315b91; background:#1b3558; color:#b9d7ff; } }
      @media (max-width:420px) { .content { padding:34px 22px 30px; } }
    </style>
  </head>
  <body>
    <main class="page" aria-labelledby="page-title">
      <div class="topline"></div>
      <section class="content">
        <img class="logo" src="https://imagenes.escuelard.com/logos/logo.png" alt="escuelaRD">
        <span class="code">404</span>
        <h1 id="page-title">P&aacute;gina no encontrada</h1>
        <p>La direcci&oacute;n que buscas no existe o ya no est&aacute; disponible.</p>
        <a class="button" href="https://escuelard.edu.do/">Volver al inicio</a>
      </section>
      <footer class="footer">escuelaRD</footer>
    </main>
  </body>
</html>
